<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Operations — Responsibilities</title>
  <style>
    body {
      font-family: sans-serif;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      margin: 0;
    }
    h1 {
      font-size: 18px;
      font-weight: 500;
      color: #1a1a1a;
      margin-bottom: 32px;
    }
    svg { max-width: 680px; width: 100%; }

    .node { cursor: pointer; }
    .node:hover rect { opacity: 0.85; }

    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple .th { fill: #3C3489; }
    .c-purple .ts { fill: #534AB7; }

    .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal .th { fill: #085041; }
    .c-teal .ts { fill: #0F6E56; }

    .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber .th { fill: #633806; }
    .c-amber .ts { fill: #854F0B; }

    .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
    .c-coral .th { fill: #712B13; }
    .c-coral .ts { fill: #993C1D; }

    .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue .th { fill: #0C447C; }
    .c-blue .ts { fill: #185FA5; }

    .c-green rect { fill: #EAF3DE; stroke: #3B6D11; }
    .c-green .th { fill: #27500A; }
    .c-green .ts { fill: #3B6D11; }

    .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; font-weight: 400; }

    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a; }
      h1 { color: #e0e0e0; }
      .c-purple rect { fill: #3C3489; stroke: #AFA9EC; }
      .c-purple .th { fill: #EEEDFE; }
      .c-purple .ts { fill: #CECBF6; }
      .c-teal rect { fill: #085041; stroke: #5DCAA5; }
      .c-teal .th { fill: #E1F5EE; }
      .c-teal .ts { fill: #9FE1CB; }
      .c-amber rect { fill: #633806; stroke: #EF9F27; }
      .c-amber .th { fill: #FAEEDA; }
      .c-amber .ts { fill: #FAC775; }
      .c-coral rect { fill: #712B13; stroke: #F0997B; }
      .c-coral .th { fill: #FAECE7; }
      .c-coral .ts { fill: #F5C4B3; }
      .c-blue rect { fill: #0C447C; stroke: #85B7EB; }
      .c-blue .th { fill: #E6F1FB; }
      .c-blue .ts { fill: #B5D4F4; }
      .c-green rect { fill: #27500A; stroke: #97C459; }
      .c-green .th { fill: #EAF3DE; }
      .c-green .ts { fill: #C0DD97; }
      .arr { stroke: #888780; }
    }
  </style>
</head>
<body>
  <h1>HR Operations — Responsibilities</h1>
  <svg viewBox="0 0 680 580" role="img">
    <title>HR Operations responsibilities</title>
    <desc>HR Operations responsibilities map at Appodeal</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <!-- Central node -->
    <g class="node c-purple">
      <rect x="255" y="240" width="170" height="52" rx="10" stroke-width="0.5"/>
      <text class="th" x="340" y="261" text-anchor="middle" dominant-baseline="central">HR Operations</text>
      <text class="ts" x="340" y="279" text-anchor="middle" dominant-baseline="central">Appodeal</text>
    </g>

    <!-- Top: Onboarding / Offboarding -->
    <g class="node c-teal">
      <rect x="210" y="60" width="260" height="52" rx="8" stroke-width="0.5"/>
      <text class="th" x="340" y="81" text-anchor="middle" dominant-baseline="central">Onboarding / offboarding</text>
      <text class="ts" x="340" y="99" text-anchor="middle" dominant-baseline="central">Structure and profiles in Rippling</text>
    </g>
    <line x1="340" y1="112" x2="340" y2="240" class="arr" marker-end="url(#arrow)"/>

    <!-- Left: Ramp cards -->
    <g class="node c-amber">
      <rect x="24" y="235" width="190" height="52" rx="8" stroke-width="0.5"/>
      <text class="th" x="119" y="256" text-anchor="middle" dominant-baseline="central">Ramp cards</text>
      <text class="ts" x="119" y="274" text-anchor="middle" dominant-baseline="central">Issuance, limits, deactivation</text>
    </g>
    <line x1="214" y1="261" x2="255" y2="261" class="arr" marker-end="url(#arrow)"/>

    <!-- Right: Salary reviews -->
    <g class="node c-coral">
      <rect x="466" y="235" width="190" height="52" rx="8" stroke-width="0.5"/>
      <text class="th" x="561" y="254" text-anchor="middle" dominant-baseline="central">Salary reviews</text>
      <text class="ts" x="561" y="272" text-anchor="middle" dominant-baseline="central">Requests and approvals</text>
    </g>
    <line x1="425" y1="261" x2="466" y2="261" class="arr" marker-end="url(#arrow)"/>

    <!-- Bottom left: Reports -->
    <g class="node c-blue">
      <rect x="70" y="430" width="210" height="52" rx="8" stroke-width="0.5"/>
      <text class="th" x="175" y="451" text-anchor="middle" dominant-baseline="central">Reports for managers</text>
      <text class="ts" x="175" y="469" text-anchor="middle" dominant-baseline="central">Salary, roles, start dates</text>
    </g>
    <line x1="290" y1="292" x2="220" y2="430" class="arr" marker-end="url(#arrow)"/>

    <!-- Bottom right: Bonuses -->
    <g class="node c-green">
      <rect x="400" y="430" width="210" height="52" rx="8" stroke-width="0.5"/>
      <text class="th" x="505" y="451" text-anchor="middle" dominant-baseline="central">Quarterly bonuses</text>
      <text class="ts" x="505" y="469" text-anchor="middle" dominant-baseline="central">Calculation by Business Unit</text>
    </g>
    <line x1="390" y1="292" x2="460" y2="430" class="arr" marker-end="url(#arrow)"/>
  </svg>
</body>
</html>
